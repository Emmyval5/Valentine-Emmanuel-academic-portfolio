<section class="container narrow">
  <h1>Contact Me</h1>
  <p>Email: <a href="mailto:emmyval15ag1208@gmail.com">emmyval15ag1208@gmail.com</a><br>Phone: +27810626693<br>Pietermaritzburg, South Africa</p>
  <form id="contact-form" novalidate>
    <label for="name">Name</label>
    <input type="text" id="name" name="name">
    <span class="error" id="name-err"></span>
    <label for="email">Email Address</label>
    <input type="email" id="email" name="email">
    <span class="error" id="email-err"></span>
    <label for="phone">Phone Number</label>
    <input type="text" id="phone" name="phone" inputmode="numeric">
    <span class="error" id="phone-err"></span>
    <label for="message">Message</label>
    <textarea id="message" name="message" rows="5"></textarea>
    <span class="error" id="message-err"></span>
    <button type="submit" class="btn">Send Message</button>
    <p id="form-success" class="success" role="status"></p>
  </form>
</section>
